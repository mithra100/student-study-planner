<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Study Planner Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
}

.login-container{
    width:90%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.logo{
    font-size:70px;
    margin-bottom:10px;
}

h1{
    color:#4f46e5;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#3730a3;
}

.quote{
    margin-top:20px;
    color:#777;
    font-size:14px;
}

</style>
</head>

<body>

<div class="login-container">

    <div class="logo">📚</div>

    <h1>Welcome Back, Student!</h1>

    <p class="subtitle">
        Track Goals, Manage Tasks & Crack Exams
    </p>

    <input type="text" id="username" placeholder="Enter Username">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">
        🚀 Login
    </button>

    <p class="quote">
        "Success is the sum of small efforts repeated every day."
    </p>

</div>

<script>

function login(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if(username === "" || password === ""){

        alert("Please enter Username and Password");

        return;
    }

    localStorage.setItem(
        "studentName",
        username
    );

    window.location.href =
        "dashboard.html";
}

</script>

</body>
</html>
