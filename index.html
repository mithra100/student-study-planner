<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
AI Study Planner Login
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
    135deg,
    #4f46e5,
    #7c3aed
    );
    padding:20px;
}

.login-container{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:30px;
    padding:35px;
    box-shadow:0 15px 40px
    rgba(0,0,0,0.15);
}

.logo{
    text-align:center;
    font-size:70px;
    margin-bottom:15px;
}

h1{
    text-align:center;
    color:#111827;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
    line-height:1.6;
}

.input-box{
    margin-bottom:15px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#f3f4f6;
    font-size:16px;
    outline:none;
}

.input-box input:focus{
    border:2px solid #7c3aed;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(
    135deg,
    #4f46e5,
    #7c3aed
    );
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.divider{
    text-align:center;
    margin:20px 0;
    color:#9ca3af;
}

.guest-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#eef2ff;
    color:#4f46e5;
    font-weight:bold;
    cursor:pointer;
}

.quote{
    text-align:center;
    margin-top:20px;
    color:#6b7280;
}

</style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        🎓
    </div>

    <h1>
        Welcome Back
    </h1>

    <p class="subtitle">

        AI Study Planner

        <br>

        Plan • Learn • Practice • Achieve

    </p>

    <div class="input-box">

        <input
        type="text"
        id="username"
        placeholder="Enter Student Name">

    </div>

    <div class="input-box">

        <input
        type="password"
        id="password"
        placeholder="Enter Password">

    </div>

    <button
    class="login-btn"
    onclick="login()">

        Continue Learning 🚀

    </button>

    <div class="divider">

        ─── OR ───

    </div>

    <button
    class="guest-btn"
    onclick="guestLogin()">

        Continue as Guest

    </button>

    <p class="quote">

        Small progress every day
        adds up to big results.

    </p>

</div>

<script>

function login(){

    const username =
    document.getElementById(
    "username"
    ).value;

    const password =
    document.getElementById(
    "password"
    ).value;

    if(
    username === "" ||
    password === ""
    ){

        alert(
        "Enter Username and Password"
        );

        return;

    }

    localStorage.setItem(
    "studentName",
    username
    );

    window.location.href =
    "dashboard.html";

}

function guestLogin(){

    localStorage.setItem(
    "studentName",
    "Guest Student"
    );

    window.location.href =
    "dashboard.html";

}

</script>

</body>
</html>
