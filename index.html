<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student OS Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(
135deg,
#4f46e5,
#7c3aed
);

padding:20px;

}

.login-card{

width:100%;
max-width:420px;

background:white;

padding:35px;

border-radius:25px;

box-shadow:
0 15px 40px rgba(0,0,0,0.15);

text-align:center;

}

.logo{

font-size:70px;
margin-bottom:15px;

}

h1{

color:#111827;
margin-bottom:10px;

}

.subtitle{

color:#6b7280;
margin-bottom:25px;

}

input{

width:100%;

padding:15px;

margin-bottom:15px;

border:none;

border-radius:15px;

background:#f3f4f6;

font-size:16px;

outline:none;

}

input:focus{

border:2px solid #7c3aed;

}

.login-btn{

width:100%;

padding:15px;

border:none;

border-radius:15px;

background:linear-gradient(
135deg,
#4f46e5,
#7c3aed
);

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

.guest-btn{

width:100%;

padding:15px;

border:none;

border-radius:15px;

background:#eef2ff;

color:#4f46e5;

font-weight:bold;

cursor:pointer;

margin-top:10px;

}

.divider{

margin:20px 0;

color:#9ca3af;

}

.quote{

margin-top:20px;

color:#6b7280;

font-size:14px;

}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
🎓
</div>

<h1>
Student OS
</h1>

<p class="subtitle">
Plan • Learn • Practice • Improve
</p>

<input
type="text"
id="username"
placeholder="Enter Student Name">

<input
type="password"
id="password"
placeholder="Enter Password">

<button
class="login-btn"
onclick="login()">

Login

</button>

<div class="divider">

──── OR ────

</div>

<button
class="guest-btn"
onclick="guestLogin()">

Continue as Guest

</button>

<p class="quote">

Small progress every day
adds up to big results 🚀

</p>

</div>

<script>

function login(){

const username =
document.getElementById(
"username"
).value;

const password =
document.getElementById(
"password"
).value;

if(
username === "" ||
password === ""
){

alert(
"Enter Username and Password"
);

return;

}

localStorage.setItem(
"studentName",
username
);

window.location.href =
"dashboard.html";

}

function guestLogin(){

localStorage.setItem(
"studentName",
"Guest Student"
);

window.location.href =
"dashboard.html";

}

</script>

</body>
</html>
