<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page"><main class="auth-container">

    <section class="auth-welcome">
        <div class="auth-logo">🎓</div>
        <h1>AI Study Planner</h1>
        <p>Plan • Learn • Practice • Improve</p>

        <div class="auth-illustration">📚 💻 ✨</div>

        <h3>Small Steps Today</h3>
        <p>Big Dreams Tomorrow ❤️</p>
    </section>

    <section class="auth-form">

        <h2>👋 Welcome Back!</h2>
        <p>Login to continue your study journey.</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your name"
                autocomplete="username"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required>

            <div class="auth-options">
                <label>
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>

                <a href="#" id="forgotLink">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-button">
                🔑 Login
            </button>
        </form>

        <div class="auth-divider">OR</div>

        <button
            type="button"
            class="auth-secondary"
            id="guestButton">
            Continue as Guest
        </button>

        <p class="auth-switch">
            Don't have an account?
            <a href="#" id="signupLink">Sign Up</a>
        </p>

        <p id="authMessage" role="status"></p>

    </section>

</main>

<script>
    const loginForm = document.getElementById("loginForm");
    const authMessage = document.getElementById("authMessage");

    loginForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        if (!username || !password.trim()) {
            authMessage.textContent =
                "Please enter your username and password.";
            return;
        }

        // Demo login: this is not real account authentication.
        localStorage.setItem("studentName", username);
        window.location.href = "Dashboard.html";
    });

    document.getElementById("guestButton")
        .addEventListener("click", function() {
            localStorage.setItem("studentName", "Guest Student");
            window.location.href = "Dashboard.html";
        });

    document.getElementById("signupLink")
        .addEventListener("click", function(event) {
            event.preventDefault();
            authMessage.textContent =
                "Signup page will be added in the next step.";
        });

    document.getElementById("forgotLink")
        .addEventListener("click", function(event) {
            event.preventDefault();
            authMessage.textContent =
                "Forgot Password page will be added in the next step.";
        });
</script>

</body>
</html>
