<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Study Planner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#eef2ff,#dbeafe);
    padding:20px;
}

.login-container{
    width:100%;
    max-width:400px;
    background:white;
    border-radius:35px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,0.12);
}

.logo{
    text-align:center;
    font-size:80px;
    margin-bottom:15px;
}

h1{
    text-align:center;
    color:#111827;
    font-size:34px;
    margin-bottom:10px;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    line-height:1.6;
    margin-bottom:30px;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:#f3f4f6;
    font-size:16px;
    outline:none;
}

.input-box input:focus{
    border:2px solid #7c3aed;
}

.login-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.login-btn:hover{
    transform:translateY(-2px);
}

.divider{
    text-align:center;
    margin:20px 0;
    color:#9ca3af;
}

.guest-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:16px;
    background:#eef2ff;
    color:#4f46e5;
    font-weight:700;
    cursor:pointer;
}

.quote{
    text-align:center;
    margin-top:25px;
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
}

</style>
</head>

<body>

<div class="login-container">

    <div class="logo">📚</div>

    <h1>Welcome Back 👋</h1>

    <p class="subtitle">
        Student Smart Planner<br>
        Plan • Learn • Practice • Achieve
    </p>

    <div class="input-box">
        <input type="text"
        id="username"
        placeholder="Student Name">
    </div>

    <div class="input-box">
        <input type="password"
        id="password"
        placeholder="Password">
    </div>

    <button class="login-btn"
    onclick="login()">
        Continue Learning 🚀
    </button>

    <div class="divider">
        ─── OR ───
    </div>

    <button class="guest-btn"
    onclick="guestLogin()">
        Continue as Guest
    </button>

    <p class="quote">
        Small progress every day<br>
        adds up to big results.
    </p>

</div>

<script>

function login(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    if(username==="" || password===""){

        alert("Enter Username and Password");
        return;
    }

    localStorage.setItem(
        "studentName",
        username
    );

    window.location.href =
    "dashboard.html";
}

function guestLogin(){

    localStorage.setItem(
        "studentName",
        "Guest Student"
    );

    window.location.href =
    "dashboard.html";
}

</script>

</body>
</html>
