<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Study Planner</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 380px;
            max-width: 92%;
            background: white;
            padding: 30px;
            border-radius: 22px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: auto;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #4f46e5;
            color: white;

            border-radius: 18px;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            margin: 15px 0 5px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        h2 {
            color: #111827;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;

            border: none;
            border-radius: 10px;

            background: #4f46e5;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }

        .switch span {
            color: #4f46e5;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

    </style>
</head>


<body>

    <div class="container">

        <div class="logo">
            📚
        </div>

        <h1>Student Study Planner</h1>

        <p class="subtitle">
            Plan smarter. Study better.
        </p>


        <!-- LOGIN -->

        <div id="loginPage">

            <h2>Welcome Back 👋</h2>

            <label>Phone Number</label>

            <input
                type="tel"
                id="loginPhone"
                placeholder="Enter your phone number"
            >


            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
            >


            <button onclick="login()">
                Login
            </button>


            <p id="loginMsg" class="message"></p>


            <div class="switch">

                Don't have an account?

                <span onclick="showSignup()">
                    Create Account
                </span>

            </div>

        </div>



        <!-- CREATE ACCOUNT -->

        <div id="signupPage" class="hidden">

            <h2>Create Your Account ✨</h2>


            <label>Full Name</label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
            >


            <label>Phone Number</label>

            <input
                type="tel"
                id="signupPhone"
                placeholder="Enter your phone number"
            >


            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
            >


            <button onclick="createAccount()">
                Create Account
            </button>


            <p id="signupMsg" class="message"></p>


            <div class="switch">

                Already have an account?

                <span onclick="showLogin()">
                    Login
                </span>

            </div>

        </div>

    </div>



    <script>

        // SHOW CREATE ACCOUNT PAGE

        function showSignup() {

            document
                .getElementById("loginPage")
                .classList.add("hidden");

            document
                .getElementById("signupPage")
                .classList.remove("hidden");

        }



        // SHOW LOGIN PAGE

        function showLogin() {

            document
                .getElementById("signupPage")
                .classList.add("hidden");

            document
                .getElementById("loginPage")
                .classList.remove("hidden");

        }



        // CREATE ACCOUNT

        function createAccount() {

            let name =
                document.getElementById("signupName").value.trim();

            let phone =
                document.getElementById("signupPhone").value.trim();

            let password =
                document.getElementById("signupPassword").value.trim();


            if (name === "" || phone === "" || password === "") {

                document.getElementById("signupMsg").innerHTML =
                    "Please fill all the fields.";

                return;
            }


            if (password.length < 6) {

                document.getElementById("signupMsg").innerHTML =
                    "Password must contain at least 6 characters.";

                return;
            }


            let account = {

                name: name,
                phone: phone,
                password: password

            };


            localStorage.setItem(
                "studentAccount",
                JSON.stringify(account)
            );


            document.getElementById("signupMsg").innerHTML =
                "Account created successfully!";


            setTimeout(function() {

                showLogin();

                document.getElementById("loginPhone").value =
                    phone;

            }, 1000);

        }



        // LOGIN

        function login() {

            let phone =
                document.getElementById("loginPhone").value.trim();

            let password =
                document.getElementById("loginPassword").value.trim();


            let savedAccount =
                localStorage.getItem("studentAccount");


            if (savedAccount === null) {

                document.getElementById("loginMsg").innerHTML =
                    "Please create an account first.";

                return;
            }


            let account =
                JSON.parse(savedAccount);


            if (
                phone === account.phone &&
                password === account.password
            ) {

                localStorage.setItem(
                    "loggedIn",
                    "true"
                );

                localStorage.setItem(
                    "studentName",
                    account.name
                );


                window.location.href =
                    "dashboard.html";

            }

            else {

                document.getElementById("loginMsg").innerHTML =
                    "Invalid phone number or password.";

            }

        }

    </script>

</body>

</html>
